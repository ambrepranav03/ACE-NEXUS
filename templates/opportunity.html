<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Opportunity | ACE NEXUS</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
        /* =====================================================
           OPPORTUNITY PAGE
           ===================================================== */

        .opportunity-page {
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding: 40px 7%;
        }

        .opportunity-page::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 0, 153, 0.12),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 70%,
                    rgba(0, 229, 255, 0.09),
                    transparent 30%
                );
            z-index: -1;
        }

        .opportunity-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 45px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 11px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.045);
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            transition: .25s ease;
        }

        .back-btn:hover {
            background: rgba(255,255,255,.09);
            transform: translateX(-3px);
        }

        .opportunity-brand {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: .5px;
        }

        .opportunity-brand span {
            color: #ff3cac;
        }

        .opportunity-container {
            max-width: 1180px;
            margin: auto;
        }

        .opportunity-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 330px;
            gap: 28px;
            align-items: start;
        }

        .opportunity-main,
        .opportunity-sidebar-card {
            border: 1px solid rgba(255,255,255,.09);
            background: rgba(14, 14, 24, .72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow:
                0 20px 70px rgba(0,0,0,.25),
                inset 0 1px 0 rgba(255,255,255,.035);
        }

        .opportunity-main {
            padding: 42px;
        }

        .opportunity-header {
            margin-bottom: 35px;
        }

        .opportunity-type-badge {
            display: inline-flex;
            align-items: center;
            padding: 7px 13px;
            border-radius: 999px;
            background: rgba(255,60,172,.1);
            border: 1px solid rgba(255,60,172,.22);
            color: #ff65bd;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .7px;
            margin-bottom: 18px;
        }

        .opportunity-title {
            font-size: clamp(32px, 5vw, 58px);
            line-height: 1.05;
            margin: 0 0 18px;
            letter-spacing: -1.8px;
        }

        .opportunity-subtitle {
            color: rgba(255,255,255,.62);
            font-size: 16px;
            line-height: 1.7;
            max-width: 760px;
            margin: 0;
        }

        .opportunity-meta-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 13px;
            margin: 30px 0;
        }

        .meta-box {
            padding: 18px;
            border-radius: 16px;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.07);
        }

        .meta-label {
            display: block;
            color: rgba(255,255,255,.43);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .7px;
            margin-bottom: 7px;
        }

        .meta-value {
            display: block;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }

        .section-title {
            font-size: 21px;
            margin: 38px 0 15px;
        }

        .description {
            color: rgba(255,255,255,.68);
            line-height: 1.85;
            font-size: 15px;
            white-space: pre-line;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 18px;
        }

        .tag {
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(0,229,255,.07);
            border: 1px solid rgba(0,229,255,.15);
            color: #7defff;
            font-size: 12px;
        }

        .opportunity-sidebar {
            position: sticky;
            top: 25px;
        }

        .opportunity-sidebar-card {
            padding: 25px;
        }

        .match-box {
            padding: 20px;
            border-radius: 18px;
            background:
                linear-gradient(
                    135deg,
                    rgba(255,60,172,.11),
                    rgba(0,229,255,.06)
                );
            border: 1px solid rgba(255,255,255,.08);
            margin-bottom: 20px;
        }

        .match-label {
            color: rgba(255,255,255,.5);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .match-score {
            display: flex;
            align-items: baseline;
            gap: 4px;
            margin-top: 6px;
        }

        .match-score strong {
            font-size: 38px;
        }

        .match-score span {
            color: rgba(255,255,255,.5);
            font-size: 13px;
        }

        .action-btn {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 15px 18px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: .25s ease;
        }

        .apply-btn {
            color: #07070c;
            background:
                linear-gradient(
                    135deg,
                    #ff3cac,
                    #7b61ff
                );
        }

        .apply-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 12px 30px rgba(255,60,172,.25);
        }

        .save-btn {
            color: #fff;
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.1);
        }

        .save-btn:hover {
            background: rgba(255,255,255,.1);
        }

        .side-info {
            margin-top: 25px;
        }

        .side-info-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        .side-info-row:last-child {
            border-bottom: 0;
        }

        .side-info-row span:first-child {
            color: rgba(255,255,255,.43);
            font-size: 12px;
        }

        .side-info-row span:last-child {
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            text-align: right;
        }

        .loading-state,
        .error-state {
            min-height: 50vh;
            display: grid;
            place-items: center;
            text-align: center;
            color: rgba(255,255,255,.6);
        }

        .error-box {
            max-width: 520px;
            padding: 35px;
            border-radius: 22px;
            border: 1px solid rgba(255,80,120,.18);
            background: rgba(255,80,120,.05);
        }

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            z-index: 9999;
            padding: 14px 18px;
            border-radius: 13px;
            background: rgba(15,15,25,.95);
            border: 1px solid rgba(255,255,255,.12);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: .25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 900px) {
            .opportunity-layout {
                grid-template-columns: 1fr;
            }

            .opportunity-sidebar {
                position: static;
            }
        }

        @media (max-width: 650px) {
            .opportunity-page {
                padding: 25px 16px;
            }

            .opportunity-main {
                padding: 25px 20px;
                border-radius: 20px;
            }

            .opportunity-meta-grid {
                grid-template-columns: 1fr 1fr;
            }

            .opportunity-title {
                font-size: 34px;
            }

            .opportunity-topbar {
                margin-bottom: 25px;
            }
        }

        @media (max-width: 450px) {
            .opportunity-meta-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="cosmic-bg"></div>

<main class="opportunity-page">

    <header class="opportunity-topbar">

        <a
            href="{{ url_for('dashboard') }}"
            class="back-btn"
        >
            ← Back to Dashboard
        </a>

        <div class="opportunity-brand">
            ACE <span>NEXUS</span>
        </div>

    </header>


    <div
        class="opportunity-container"
        id="opportunityContainer"
    >

        <div class="loading-state" id="loadingState">
            <div>
                <h2>Loading opportunity...</h2>
                <p>ACE NEXUS is fetching the opportunity details.</p>
            </div>
        </div>

    </div>

</main>


<div class="toast" id="toast"></div>


<script>
document.addEventListener("DOMContentLoaded", () => {

    const container =
        document.getElementById("opportunityContainer");

    const toast =
        document.getElementById("toast");

    const opportunityId =
        getOpportunityId();

    let currentOpportunity = null;


    /* =====================================================
       GET OPPORTUNITY ID
       ===================================================== */

    function getOpportunityId() {

        const parts =
            window.location.pathname.split("/");

        const last =
            parts[parts.length - 1];

        const id =
            Number(last);

        return Number.isFinite(id)
            ? id
            : null;
    }


    /* =====================================================
       LOAD
       ===================================================== */

    async function loadOpportunity() {

        if (!opportunityId) {
            showError("Invalid opportunity ID.");
            return;
        }

        try {

            const response =
                await fetch(
                    `/api/opportunities/${opportunityId}`,
                    {
                        credentials: "same-origin"
                    }
                );

            if (!response.ok) {
                throw new Error(
                    "Opportunity not found."
                );
            }

            const data =
                await response.json();

            currentOpportunity =
                data.opportunity ||
                data;

            if (
                !currentOpportunity ||
                typeof currentOpportunity !== "object"
            ) {
                throw new Error(
                    "Invalid opportunity data."
                );
            }

            renderOpportunity(
                currentOpportunity
            );

        } catch (error) {

            console.error(error);

            showError(
                error.message ||
                "Unable to load this opportunity."
            );
        }
    }


    /* =====================================================
       RENDER
       ===================================================== */

    function renderOpportunity(opportunity) {

        const title =
            escapeHTML(
                opportunity.title ||
                opportunity.name ||
                "Untitled Opportunity"
            );

        const type =
            escapeHTML(
                opportunity.type ||
                opportunity.category ||
                "Opportunity"
            );

        const location =
            escapeHTML(
                opportunity.location ||
                "India"
            );

        const mode =
            escapeHTML(
                opportunity.mode ||
                opportunity.format ||
                "Online"
            );

        const deadline =
            formatDate(
                opportunity.deadline ||
                opportunity.application_deadline
            );

        const reward =
            escapeHTML(
                opportunity.reward ||
                opportunity.prize ||
                opportunity.benefit ||
                "Not specified"
            );

        const organization =
            escapeHTML(
                opportunity.organization ||
                opportunity.organizer ||
                opportunity.company ||
                "ACE NEXUS Organizer"
            );

        const description =
            escapeHTML(
                opportunity.description ||
                "No detailed description has been provided."
            );

        const match =
            Number(
                opportunity.match ??
                opportunity.match_score ??
                0
            ) || 0;

        const applicants =
            Number(
                opportunity.applicants_count ??
                opportunity.application_count ??
                opportunity.applicants ??
                0
            ) || 0;

        const views =
            Number(
                opportunity.views ??
                opportunity.view_count ??
                0
            ) || 0;

        const tags =
            normalizeTags(
                opportunity.tags
            );

        container.innerHTML = `

            <div class="opportunity-layout">

                <section class="opportunity-main">

                    <div class="opportunity-header">

                        <span class="opportunity-type-badge">
                            ${type}
                        </span>

                        <h1 class="opportunity-title">
                            ${title}
                        </h1>

                        <p class="opportunity-subtitle">
                            ${organization}
                        </p>

                    </div>


                    <div class="opportunity-meta-grid">

                        <div class="meta-box">
                            <span class="meta-label">
                                Location
                            </span>

                            <span class="meta-value">
                                📍 ${location}
                            </span>
                        </div>


                        <div class="meta-box">
                            <span class="meta-label">
                                Mode
                            </span>

                            <span class="meta-value">
                                ◉ ${mode}
                            </span>
                        </div>


                        <div class="meta-box">
                            <span class="meta-label">
                                Deadline
                            </span>

                            <span class="meta-value">
                                ⏳ ${deadline}
                            </span>
                        </div>


                        <div class="meta-box">
                            <span class="meta-label">
                                Reward
                            </span>

                            <span class="meta-value">
                                ${reward}
                            </span>
                        </div>


                        <div class="meta-box">
                            <span class="meta-label">
                                Applicants
                            </span>

                            <span class="meta-value">
                                ${applicants}
                            </span>
                        </div>


                        <div class="meta-box">
                            <span class="meta-label">
                                Views
                            </span>

                            <span class="meta-value">
                                ${views}
                            </span>
                        </div>

                    </div>


                    <h2 class="section-title">
                        About this opportunity
                    </h2>

                    <div class="description">
                        ${description}
                    </div>


                    ${
                        tags.length
                        ? `
                            <h2 class="section-title">
                                Skills & Tags
                            </h2>

                            <div class="tags">
                                ${tags
                                    .map(
                                        tag =>
                                        `<span class="tag">
                                            ${escapeHTML(tag)}
                                        </span>`
                                    )
                                    .join("")
                                }
                            </div>
                        `
                        : ""
                    }

                </section>


                <aside class="opportunity-sidebar">

                    <div class="opportunity-sidebar-card">

                        <div class="match-box">

                            <span class="match-label">
                                Your ACE Match
                            </span>

                            <div class="match-score">
                                <strong>
                                    ${match || "—"}
                                </strong>

                                ${
                                    match
                                    ? "<span>% match</span>"
                                    : ""
                                }
                            </div>

                        </div>


                        <button
                            class="action-btn apply-btn"
                            id="applyBtn"
                        >
                            Apply Now →
                        </button>


                        <button
                            class="action-btn save-btn"
                            id="saveBtn"
                        >
                            ☆ Save Opportunity
                        </button>


                        <div class="side-info">

                            <div class="side-info-row">
                                <span>Organization</span>
                                <span>${organization}</span>
                            </div>

                            <div class="side-info-row">
                                <span>Type</span>
                                <span>${type}</span>
                            </div>

                            <div class="side-info-row">
                                <span>Location</span>
                                <span>${location}</span>
                            </div>

                            <div class="side-info-row">
                                <span>Deadline</span>
                                <span>${deadline}</span>
                            </div>

                        </div>

                    </div>

                </aside>

            </div>
        `;


        setupActions();
    }


    /* =====================================================
       APPLY
       ===================================================== */

    function setupActions() {

        const applyBtn =
            document.getElementById("applyBtn");

        const saveBtn =
            document.getElementById("saveBtn");


        if (applyBtn) {

            applyBtn.addEventListener(
                "click",
                applyToOpportunity
            );
        }


        if (saveBtn) {

            updateSaveButton();

            saveBtn.addEventListener(
                "click",
                toggleSave
            );
        }
    }


    async function applyToOpportunity() {

        if (!currentOpportunity) return;

        const id =
            currentOpportunity.id ||
            opportunityId;

        try {

            const response =
                await fetch(
                    `/api/applications/${id}`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        credentials:
                            "same-origin"
                    }
                );

            const data =
                await response
                    .json()
                    .catch(() => ({}));

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Unable to apply."
                );
            }

            saveApplicationLocally(id);

            showToast(
                "Application submitted successfully."
            );

            const button =
                document.getElementById("applyBtn");

            if (button) {
                button.textContent =
                    "✓ Applied";
                button.disabled = true;
            }

        } catch (error) {

            console.error(error);

            /*
             * Keep local fallback for the current
             * prototype if backend application handling
             * is unavailable.
             */
            saveApplicationLocally(id);

            showToast(
                "Application saved to your ACE profile."
            );

            const button =
                document.getElementById("applyBtn");

            if (button) {
                button.textContent =
                    "✓ Applied";
                button.disabled = true;
            }
        }
    }


    function saveApplicationLocally(id) {

        let applications = [];

        try {
            applications =
                JSON.parse(
                    localStorage.getItem(
                        "aceApplications"
                    ) || "[]"
                );
        } catch {
            applications = [];
        }

        const exists =
            applications.some(
                item =>
                    String(
                        item.id ||
                        item.opportunityId
                    ) === String(id)
            );

        if (!exists) {

            applications.push({
                id: id,
                opportunityId: id,
                title:
                    currentOpportunity.title ||
                    currentOpportunity.name ||
                    "Opportunity",
                appliedOn:
                    new Date().toISOString(),
                status: "Applied"
            });

            localStorage.setItem(
                "aceApplications",
                JSON.stringify(applications)
            );
        }
    }


    /* =====================================================
       SAVE
       ===================================================== */

    function getSaved() {

        try {

            const saved =
                JSON.parse(
                    localStorage.getItem(
                        "aceSavedOpportunities"
                    ) || "[]"
                );

            return Array.isArray(saved)
                ? saved
                : [];

        } catch {

            return [];
        }
    }


    function updateSaveButton() {

        const button =
            document.getElementById("saveBtn");

        if (!button || !currentOpportunity) {
            return;
        }

        const id =
            currentOpportunity.id ||
            opportunityId;

        const saved =
            getSaved().some(
                item =>
                    String(
                        item.id ||
                        item.opportunityId
                    ) === String(id)
            );

        button.textContent =
            saved
                ? "★ Saved"
                : "☆ Save Opportunity";
    }


    async function toggleSave() {

        if (!currentOpportunity) return;

        const id =
            currentOpportunity.id ||
            opportunityId;

        let saved =
            getSaved();

        const index =
            saved.findIndex(
                item =>
                    String(
                        item.id ||
                        item.opportunityId
                    ) === String(id)
            );

        if (index >= 0) {

            saved.splice(index, 1);

            localStorage.setItem(
                "aceSavedOpportunities",
                JSON.stringify(saved)
            );

            try {

                await fetch(
                    `/api/saved/${id}`,
                    {
                        method: "DELETE",
                        credentials:
                            "same-origin"
                    }
                );

            } catch {}

            showToast(
                "Removed from saved."
            );

        } else {

            const item = {
                id: id,
                opportunityId: id,
                title:
                    currentOpportunity.title ||
                    currentOpportunity.name ||
                    "Opportunity",
                location:
                    currentOpportunity.location ||
                    "",
                type:
                    currentOpportunity.type ||
                    currentOpportunity.category ||
                    "",
                savedOn:
                    new Date().toISOString()
            };

            saved.push(item);

            localStorage.setItem(
                "aceSavedOpportunities",
                JSON.stringify(saved)
            );

            try {

                await fetch(
                    `/api/saved/${id}`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        credentials:
                            "same-origin"
                    }
                );

            } catch {}

            showToast(
                "Saved to your opportunities."
            );
        }

        updateSaveButton();
    }


    /* =====================================================
       ERROR
       ===================================================== */

    function showError(message) {

        container.innerHTML = `
            <div class="error-state">

                <div class="error-box">

                    <h2>
                        Opportunity unavailable
                    </h2>

                    <p>
                        ${escapeHTML(message)}
                    </p>

                    <br>

                    <a
                        href="{{ url_for('dashboard') }}"
                        class="back-btn"
                    >
                        ← Return to Dashboard
                    </a>

                </div>

            </div>
        `;
    }


    /* =====================================================
       TOAST
       ===================================================== */

    function showToast(message) {

        if (!toast) return;

        toast.textContent = message;

        toast.classList.add("show");

        clearTimeout(
            toast._timer
        );

        toast._timer =
            setTimeout(() => {
                toast.classList.remove(
                    "show"
                );
            }, 3000);
    }


    /* =====================================================
       HELPERS
       ===================================================== */

    function normalizeTags(tags) {

        if (Array.isArray(tags)) {
            return tags.filter(Boolean);
        }

        if (typeof tags === "string") {

            return tags
                .split(",")
                .map(
                    tag => tag.trim()
                )
                .filter(Boolean);
        }

        return [];
    }


    function formatDate(value) {

        if (!value) {
            return "No deadline";
        }

        const date =
            new Date(value);

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {
            return String(value);
        }

        return date.toLocaleDateString(
            "en-IN",
            {
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        );
    }


    function escapeHTML(value) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    /* =====================================================
       START
       ===================================================== */

    loadOpportunity();

});
