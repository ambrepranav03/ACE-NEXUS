<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ACE NEXUS | Student Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(242,27,143,.13),
                    transparent 38%
                ),
                #030308;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-page {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            inset: 0;
            opacity: .7;
            pointer-events: none;

            background-image:
                radial-gradient(1px 1px at 10% 20%, white, transparent),
                radial-gradient(1px 1px at 25% 70%, white, transparent),
                radial-gradient(1px 1px at 45% 35%, white, transparent),
                radial-gradient(1px 1px at 65% 15%, white, transparent),
                radial-gradient(1px 1px at 80% 65%, white, transparent),
                radial-gradient(1px 1px at 92% 30%, white, transparent),
                radial-gradient(1px 1px at 35% 90%, white, transparent);
        }

        .topbar {
            position: relative;
            z-index: 5;

            padding: 28px 42px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 800;
            font-size: 21px;

            background:
                linear-gradient(
                    135deg,
                    #ff4bb4,
                    #7b00ff
                );

            box-shadow:
                0 0 25px rgba(242,27,143,.55);
        }

        .brand-name {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand-tag {
            margin-top: 4px;
            font-size: 8px;
            letter-spacing: 1.6px;
            color: #77717b;
        }

        .home-link {
            color: #aaa4ad;
            text-decoration: none;

            padding: 12px 19px;

            border-radius: 30px;

            border: 1px solid rgba(255,255,255,.09);

            background: rgba(255,255,255,.025);

            font-size: 12px;

            transition: .25s ease;
        }

        .home-link:hover {
            color: white;
            border-color: rgba(242,27,143,.4);
        }

        .login-container {
            min-height: calc(100vh - 100px);

            display: flex;
            align-items: flex-start;
            justify-content: center;

            padding: 30px 20px 70px;

            position: relative;
            z-index: 2;
        }

        .login-card {
            width: 100%;
            max-width: 470px;

            padding: 42px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid rgba(255,255,255,.11);

            backdrop-filter: blur(25px);

            box-shadow:
                0 35px 100px rgba(0,0,0,.65),
                0 0 80px rgba(143,6,79,.12);

            box-sizing: border-box;
        }

        .label {
            display: inline-block;

            padding: 8px 14px;

            border-radius: 30px;

            border: 1px solid rgba(242,27,143,.25);

            background: rgba(242,27,143,.055);

            color: #ff79bd;

            font-size: 10px;
            font-weight: 700;

            letter-spacing: 1.5px;

            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 12px;

            font-size: 42px;

            line-height: 1;

            letter-spacing: -2px;
        }

        h1 span {
            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ff72ba,
                    #a30662
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin: 0 0 30px;

            color: #8e8790;

            font-size: 13px;

            line-height: 1.7;
        }

        .field {
            display: flex;
            flex-direction: column;

            gap: 8px;

            margin-bottom: 18px;
        }

        .field label {
            font-size: 11px;
            font-weight: 600;
            color: #d3ccd4;
        }

        .field input {
            width: 100%;
            box-sizing: border-box;

            padding: 15px;

            border-radius: 11px;

            outline: none;

            border: 1px solid rgba(255,255,255,.09);

            background: rgba(0,0,0,.25);

            color: white;

            font-size: 13px;

            transition: .25s ease;
        }

        .field input:focus {
            border-color: rgba(242,27,143,.5);

            box-shadow:
                0 0 0 3px
                rgba(242,27,143,.05);
        }

        .field input::placeholder {
            color: #59535b;
        }

        #loginMessage {
            display: none;

            margin-bottom: 18px;

            padding: 12px 15px;

            border-radius: 11px;

            font-size: 12px;

            line-height: 1.5;
        }

        #loginMessage.show {
            display: block;
        }

        .login-button {
            width: 100%;

            padding: 15px;

            margin-top: 5px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            color: white;

            font-size: 13px;

            font-weight: 700;

            background:
                linear-gradient(
                    100deg,
                    #a30662,
                    #f21b8f
                );

            box-shadow:
                0 12px 35px
                rgba(242,27,143,.2);

            transition: .25s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 16px 40px
                rgba(242,27,143,.32);
        }

        .login-button:disabled {
            opacity: .65;
            cursor: wait;
            transform: none;
        }

        .footer {
            margin-top: 25px;

            text-align: center;

            color: #77717a;

            font-size: 12px;
        }

        .footer a {
            color: #ff72ba;

            text-decoration: none;

            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .topbar {
                padding: 22px 20px;
            }

            .login-card {
                padding: 28px 22px;
                border-radius: 22px;
            }

            h1 {
                font-size: 34px;
            }

        }

    </style>

</head>


<body>

<div class="login-page">

    <div class="stars"></div>


    <!-- TOP BAR -->

    <header class="topbar">

        <div class="brand">

            <div class="logo">
                A
            </div>

            <div>

                <div class="brand-name">
                    ACE NEXUS
                </div>

                <div class="brand-tag">
                    YOUR PATH. OUR UNIVERSE.
                </div>

            </div>

        </div>


        <a
            href="/"
            class="home-link">

            ← Back to home

        </a>

    </header>


    <!-- LOGIN -->

    <main class="login-container">

        <section class="login-card">

            <div class="label">
                STUDENT LOGIN
            </div>


            <h1>
                Welcome <span>back</span>
            </h1>


            <p class="subtitle">

                Continue your journey and discover
                opportunities matched to your goals.

            </p>


            <div
                id="loginMessage">
            </div>


            <form
                id="studentLoginForm">


                <div class="field">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton">

                    Login to ACE NEXUS →

                </button>


            </form>


            <div class="footer">

                Don't have an account?

                <a href="/student-register">
                    Create Student Account
                </a>

            </div>

        </section>

    </main>

</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const form =
            document.getElementById(
                "studentLoginForm"
            );

        const message =
            document.getElementById(
                "loginMessage"
            );

        const button =
            document.getElementById(
                "loginButton"
            );


        function showMessage(
            text,
            success = false
        ) {

            message.textContent =
                text;

            message.classList.add(
                "show"
            );

            if (success) {

                message.style.color =
                    "#72ffb2";

                message.style.background =
                    "rgba(40,220,130,.10)";

                message.style.border =
                    "1px solid rgba(40,220,130,.25)";

            } else {

                message.style.color =
                    "#ff8bb8";

                message.style.background =
                    "rgba(255,60,120,.10)";

                message.style.border =
                    "1px solid rgba(255,60,120,.25)";

            }

        }


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                if (!email || !password) {

                    showMessage(
                        "Please enter your email and password."
                    );

                    return;

                }


                button.disabled = true;

                button.textContent =
                    "Signing in...";


                try {

                    const response =
                        await fetch(
                            "/api/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials:
                                    "same-origin",

                                body:
                                    JSON.stringify({
                                        email:
                                            email,

                                        password:
                                            password
                                    })
                            }
                        );


                    const contentType =
                        response.headers.get(
                            "content-type"
                        ) || "";


                    if (
                        !contentType.includes(
                            "application/json"
                        )
                    ) {

                        const text =
                            await response.text();

                        console.error(
                            "SERVER RESPONSE:",
                            text
                        );

                        throw new Error(
                            "Flask returned an HTML page instead of JSON."
                        );

                    }


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        showMessage(
                            data.error ||
                            "Invalid email or password."
                        );

                        return;

                    }


                    if (data.user) {

                        localStorage.setItem(
                            "aceUser",
                            JSON.stringify(
                                data.user
                            )
                        );

                        localStorage.setItem(
                            "aceUserRole",
                            data.user.role ||
                            "student"
                        );

                        localStorage.setItem(
                            "aceStudentName",
                            data.user.name ||
                            ""
                        );

                    }


                    showMessage(
                        "Login successful. Opening your dashboard...",
                        true
                    );


                    setTimeout(
                        function () {

                            window.location.href =
                                data.redirect ||
                                "/dashboard";

                        },
                        600
                    );


                } catch (error) {

                    console.error(
                        "LOGIN ERROR:",
                        error
                    );

                    showMessage(
                        error.message ||
                        "Unable to connect to ACE NEXUS."
                    );


                } finally {

                    button.disabled =
                        false;

                    button.textContent =
                        "Login to ACE NEXUS →";

                }

            }
        );

    }
);

</script>


</body>

</html>
