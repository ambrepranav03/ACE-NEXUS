<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ACE NEXUS | Organizer Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            margin:0;
            min-height:100vh;
            background:
                radial-gradient(circle at 50% 20%,rgba(242,27,143,.13),transparent 38%),
                #030308;
            color:white;
            font-family:Arial,sans-serif;
        }

        .page {
            min-height:100vh;
            position:relative;
            overflow:hidden;
        }

        .stars {
            position:fixed;
            inset:0;
            opacity:.7;
            pointer-events:none;

            background-image:
                radial-gradient(1px 1px at 10% 20%,white,transparent),
                radial-gradient(1px 1px at 25% 70%,white,transparent),
                radial-gradient(1px 1px at 45% 35%,white,transparent),
                radial-gradient(1px 1px at 65% 15%,white,transparent),
                radial-gradient(1px 1px at 80% 65%,white,transparent),
                radial-gradient(1px 1px at 92% 30%,white,transparent);
        }

        .topbar {
            position:relative;
            z-index:2;

            padding:28px 42px;

            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .brand {
            display:flex;
            align-items:center;
            gap:13px;
        }

        .logo {
            width:42px;
            height:42px;
            border-radius:50%;

            display:flex;
            align-items:center;
            justify-content:center;

            font-weight:800;
            font-size:21px;

            background:
                linear-gradient(135deg,#ff4bb4,#7b00ff);

            box-shadow:
                0 0 25px rgba(242,27,143,.55);
        }

        .brand-name {
            font-size:17px;
            font-weight:800;
            letter-spacing:1px;
        }

        .brand-tag {
            margin-top:4px;
            font-size:8px;
            letter-spacing:1.6px;
            color:#77717b;
        }

        .home {
            color:#aaa4ad;
            text-decoration:none;

            padding:12px 19px;

            border-radius:30px;

            border:1px solid rgba(255,255,255,.09);

            font-size:12px;
        }

        .container {
            min-height:calc(100vh - 100px);

            display:flex;
            justify-content:center;

            padding:30px 20px 70px;

            position:relative;
            z-index:2;
        }

        .card {
            width:100%;
            max-width:470px;

            padding:42px;

            box-sizing:border-box;

            border-radius:28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            border:1px solid rgba(255,255,255,.11);

            backdrop-filter:blur(25px);

            box-shadow:
                0 35px 100px rgba(0,0,0,.65);
        }

        .label {
            display:inline-block;

            padding:8px 14px;

            border-radius:30px;

            border:1px solid rgba(242,27,143,.25);

            color:#ff79bd;

            font-size:10px;
            font-weight:700;

            letter-spacing:1.5px;

            margin-bottom:18px;
        }

        h1 {
            margin:0 0 12px;

            font-size:42px;

            letter-spacing:-2px;
        }

        h1 span {
            background:
                linear-gradient(
                    90deg,
                    #fff,
                    #ff72ba,
                    #a30662
                );

            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .subtitle {
            color:#8e8790;

            font-size:13px;

            line-height:1.7;

            margin-bottom:30px;
        }

        .field {
            display:flex;
            flex-direction:column;

            gap:8px;

            margin-bottom:18px;
        }

        label {
            font-size:11px;
            font-weight:600;
            color:#d3ccd4;
        }

        input {
            width:100%;
            box-sizing:border-box;

            padding:15px;

            border-radius:11px;

            outline:none;

            border:1px solid rgba(255,255,255,.09);

            background:rgba(0,0,0,.25);

            color:white;

            font-size:13px;
        }

        input:focus {
            border-color:rgba(242,27,143,.5);
        }

        #message {
            display:none;

            padding:12px 15px;

            border-radius:11px;

            font-size:12px;

            margin-bottom:18px;
        }

        #message.show {
            display:block;
        }

        button {
            width:100%;

            padding:15px;

            border:0;

            border-radius:12px;

            cursor:pointer;

            color:white;

            font-size:13px;

            font-weight:700;

            background:
                linear-gradient(
                    100deg,
                    #a30662,
                    #f21b8f
                );
        }

        button:disabled {
            opacity:.65;
            cursor:wait;
        }

        .footer {
            margin-top:25px;

            text-align:center;

            color:#77717a;

            font-size:12px;
        }

        .footer a {
            color:#ff72ba;
            text-decoration:none;
            font-weight:600;
        }

        @media(max-width:600px) {

            .topbar {
                padding:22px 20px;
            }

            .card {
                padding:28px 22px;
            }

            h1 {
                font-size:34px;
            }
        }

    </style>

</head>


<body>

<div class="page">

    <div class="stars"></div>


    <header class="topbar">

        <div class="brand">

            <div class="logo">
                A
            </div>

            <div>

                <div class="brand-name">
                    ACE NEXUS
                </div>

                <div class="brand-tag">
                    YOUR PATH. OUR UNIVERSE.
                </div>

            </div>

        </div>


        <a
            href="/"
            class="home">

            ← Back to home

        </a>

    </header>


    <main class="container">

        <section class="card">

            <div class="label">
                ORGANIZER LOGIN
            </div>


            <h1>
                Welcome <span>back</span>
            </h1>


            <p class="subtitle">

                Manage your opportunities,
                reach students and grow your community.

            </p>


            <div id="message"></div>


            <form id="loginForm">

                <div class="field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="organizer@example.com"
                        required>

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button
                    type="submit"
                    id="loginButton">

                    Login to Organizer Hub →

                </button>

            </form>


            <div class="footer">

                Don't have an organizer account?

                <a href="/organizer-register">
                    Create Organizer Account
                </a>

            </div>

        </section>

    </main>

</div>


<script>

document.addEventListener("DOMContentLoaded", () => {

    const form =
        document.getElementById("loginForm");

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("loginButton");


    function showMessage(text,success=false) {

        message.textContent = text;

        message.classList.add("show");

        message.style.color =
            success ? "#72ffb2" : "#ff8bb8";

        message.style.background =
            success
                ? "rgba(40,220,130,.10)"
                : "rgba(255,60,120,.10)";

        message.style.border =
            success
                ? "1px solid rgba(40,220,130,.25)"
                : "1px solid rgba(255,60,120,.25)";
    }


    form.addEventListener("submit",async event => {

        event.preventDefault();


        const email =
            document.getElementById("email")
                .value.trim();

        const password =
            document.getElementById("password")
                .value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password."
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Signing in...";


        try {

            const response =
                await fetch("/api/login", {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    credentials:"same-origin",

                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                });


            const contentType =
                response.headers.get(
                    "content-type"
                ) || "";


            if (!contentType.includes("application/json")) {

                const text =
                    await response.text();

                console.error(
                    "SERVER RESPONSE:",
                    text
                );

                throw new Error(
                    "Flask returned an HTML page instead of JSON."
                );
            }


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                showMessage(
                    data.error ||
                    "Invalid email or password."
                );

                return;
            }


            if (data.user) {

                localStorage.setItem(
                    "aceUser",
                    JSON.stringify(data.user)
                );

                localStorage.setItem(
                    "aceUserRole",
                    "organizer"
                );
            }


            showMessage(
                "Login successful. Opening Organizer Hub...",
                true
            );


            setTimeout(() => {

                window.location.href =
                    "/organizer-dashboard";

            },600);


        } catch(error) {

            console.error(error);

            showMessage(
                error.message ||
                "Unable to connect to ACE NEXUS."
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Login to Organizer Hub →";
        }

    });

});

</script>

</body>
</html>
