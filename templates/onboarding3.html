<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACE NEXUS | Career Goals</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="cosmic-scene">

        <div class="stars"></div>

        <div class="galaxy">
            <div class="galaxy-core"></div>
        </div>

        <div class="black-hole">
            <div class="black-hole-core"></div>
            <div class="black-hole-ring"></div>
        </div>

        <div class="cosmic-particles"></div>

    </div>


    <div class="onboarding-page">

        <div class="onboarding-card">

            <div class="onboarding-label">
                ✦ BUILD YOUR NEXUS
            </div>

            <h1>
                Where do you
                <span>want to go?</span>
            </h1>

            <p class="onboarding-intro">
                Tell us what you're working towards. ACE NEXUS will use
                your goals to discover opportunities that can move you forward.
            </p>

            <div class="progress">
                <div class="progress-fill step-three"></div>
            </div>

            <div class="step-text">
                STEP 3 OF 3
            </div>


            <!-- Career Goal -->

            <div class="selection-section">

                <label>Your career goal</label>

                <div class="selection-grid">

                    <button type="button" class="selection-chip">
                        Software Developer
                    </button>

                    <button type="button" class="selection-chip">
                        AI / ML Engineer
                    </button>

                    <button type="button" class="selection-chip">
                        Data Scientist
                    </button>

                    <button type="button" class="selection-chip">
                        Cybersecurity
                    </button>

                    <button type="button" class="selection-chip">
                        Research
                    </button>

                    <button type="button" class="selection-chip">
                        Entrepreneur
                    </button>

                    <button type="button" class="selection-chip">
                        Product / Management
                    </button>

                    <button type="button" class="selection-chip">
                        Still Exploring
                    </button>

                </div>

            </div>


            <!-- Opportunity Type -->

            <div class="selection-section">

                <label>What opportunities interest you?</label>

                <div class="selection-grid">

                    <button type="button" class="selection-chip">
                        Hackathons
                    </button>

                    <button type="button" class="selection-chip">
                        Internships
                    </button>

                    <button type="button" class="selection-chip">
                        Competitions
                    </button>

                    <button type="button" class="selection-chip">
                        Workshops
                    </button>

                    <button type="button" class="selection-chip">
                        Conferences
                    </button>

                    <button type="button" class="selection-chip">
                        Research Programs
                    </button>

                </div>

            </div>


            <!-- Discovery Preference -->

            <div class="selection-section">

                <label>Where do you want to discover opportunities?</label>

                <div class="selection-grid">

                    <button type="button" class="selection-chip">
                        📍 Near Me
                    </button>

                    <button type="button" class="selection-chip">
                        🇮🇳 Anywhere in India
                    </button>

                    <button type="button" class="selection-chip">
                        🌐 Online
                    </button>

                </div>

            </div>


           <a href="/dashboard" class="continue-button">
    Enter My Nexus →
</a>

        </div>

    </div>
    <script src="{{ url_for('static', filename='js/onboarding.js') }}"></script>

</body>
</html>

</body>
</html>
