<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACE NEXUS | Skills & Interests</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="onboarding-page">

        <div class="onboarding-card">

            <div class="onboarding-label">
                ✦ BUILD YOUR NEXUS
            </div>

            <h1>
                What are you
                <span>curious about?</span>
            </h1>

            <p class="onboarding-intro">
                Choose your skills and interests. ACE NEXUS will use them
                to find opportunities that match your profile.
            </p>

            <div class="progress">
                <div class="progress-fill step-two"></div>
            </div>

            <div class="step-text">
                STEP 2 OF 3
            </div>


            <!-- Skills -->

            <div class="selection-section">

                <label>Your skills</label>

                <div class="selection-grid">

                    <button type="button" class="selection-chip">
                        Python
                    </button>

                    <button type="button" class="selection-chip">
                        Java
                    </button>

                    <button type="button" class="selection-chip">
                        C / C++
                    </button>

                    <button type="button" class="selection-chip">
                        AI / ML
                    </button>

                    <button type="button" class="selection-chip">
                        Data Science
                    </button>

                    <button type="button" class="selection-chip">
                        Web Development
                    </button>

                    <button type="button" class="selection-chip">
                        UI / UX
                    </button>

                    <button type="button" class="selection-chip">
                        Cybersecurity
                    </button>

                    <button type="button" class="selection-chip">
                        Cloud
                    </button>

                    <button type="button" class="selection-chip">
                        IoT
                    </button>

                </div>

            </div>


            <!-- Interests -->

            <div class="selection-section">

                <label>Your interests</label>

                <div class="selection-grid">

                    <button type="button" class="selection-chip">
                        Hackathons
                    </button>

                    <button type="button" class="selection-chip">
                        Competitions
                    </button>

                    <button type="button" class="selection-chip">
                        Workshops
                    </button>

                    <button type="button" class="selection-chip">
                        Internships
                    </button>

                    <button type="button" class="selection-chip">
                        Research
                    </button>

                    <button type="button" class="selection-chip">
                        Entrepreneurship
                    </button>

                    <button type="button" class="selection-chip">
                        Networking
                    </button>

                    <button type="button" class="selection-chip">
                        Open Source
                    </button>

                </div>

            </div>


            <a href="/onboarding3" class="continue-button">
    Continue →
</a>

        </div>

    </div>
    <script src="{{ url_for('static', filename='js/onboarding.js') }}"></script>

</body>

<div class="cosmic-scene">

    <div class="stars"></div>

    <div class="galaxy">
        <div class="galaxy-core"></div>
    </div>

    <div class="black-hole">
        <div class="black-hole-core"></div>
        <div class="black-hole-ring"></div>
    </div>

    <div class="cosmic-particles"></div>

</div>
</html>
